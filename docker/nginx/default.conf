server {
    listen 80;
    server_name calendario-cavalcalupi.mandich.dev;
    root /var/www/html/public;
    index index.php;
    charset utf-8;

    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";

    if (!-d $request_filename) {
        rewrite ^/(.+)/$ /$1 permanent;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Asset Vite e icone: stanno nel volume build_assets, montato in /var/www/build
    # (non dentro public/, che è in sola lettura; vedi docker-compose.yml)
    location /build/ {
        alias /var/www/build/;
        access_log off;
    }

    # favicon alla radice: il file vero è generato dall'immagine Docker in
    # build/icons (vedi docker/icons/generate-icons.sh)
    location = /favicon.ico {
        alias /var/www/build/icons/favicon.ico;
        access_log off;
        log_not_found off;
    }
    location = /site.webmanifest {
        alias /var/www/build/icons/site.webmanifest;
        access_log off;
        log_not_found off;
    }
    location = /robots.txt {
        access_log off;
        log_not_found off;
    }

    error_page 404 /index.php;

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_param HTTP_AUTHORIZATION $http_authorization;
        include fastcgi_params;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
