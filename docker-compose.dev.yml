services:
  app:
    build: .
    image: calendario-cavalcalupi:dev
    container_name: calendario-cavalcalupi_app_dev
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
      - ./public/build:/var/www/html/public/build
    environment:
      - DB_HOST=db
      - DB_DATABASE=calendario_cavalcalupi
      - DB_USERNAME=calendario_cavalcalupi
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      internal:
        ipv4_address: 172.25.0.10
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: calendario-cavalcalupi_nginx_dev
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
    networks:
      - internal
    depends_on:
      - app

  db:
    image: mariadb:11
    container_name: calendario-cavalcalupi_db_dev
    restart: unless-stopped
    ports:
      - 3307:3306
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=calendario_cavalcalupi
    volumes:
      - db_data_dev:/var/lib/mysql
      - ./docker/mysql/init.dev.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: [ "CMD", "healthcheck.sh", "--connect", "--innodb_initialized" ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    image: calendario-cavalcalupi:dev
    container_name: calendario-cavalcalupi_worker_dev
    restart: unless-stopped
    command: php artisan queue:work --max-time=3600
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
    environment:
      - DB_HOST=db
      - DB_DATABASE=calendario_cavalcalupi
      - DB_USERNAME=calendario_cavalcalupi
      - DB_PASSWORD=${DB_PASSWORD}
    networks:
      internal:
        ipv4_address: 172.25.0.11
    depends_on:
      db:
        condition: service_healthy

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.25.0.0/24

volumes:
  db_data_dev:
