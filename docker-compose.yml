services:
  app:
    build: .
    container_name: calendario-cavalcalupi_app
    restart: unless-stopped
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
      - build_assets:/var/www/html/public/build
    environment:
      - DB_HOST=db
      - DB_DATABASE=calendario_cavalcalupi
      - DB_USERNAME=calendario_cavalcalupi
      - DB_PASSWORD=
    networks:
      internal:
        ipv4_address: 172.24.0.10
    depends_on:
      db:
        condition: service_healthy

  nginx:
    image: nginx:alpine
    container_name: calendario-cavalcalupi_nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./public:/var/www/html/public:ro
      - build_assets:/var/www/html/build-assets:ro
    networks:
      - internal
      - proxy
    depends_on:
      - app
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.calendario-cavalcalupi.rule=Host(`calendario-cavalcalupi.mandich.dev`)"
      - "traefik.http.routers.calendario-cavalcalupi.entrypoints=websecure"
      - "traefik.http.routers.calendario-cavalcalupi.tls.certresolver=letsencrypt"
      - "traefik.http.services.calendario-cavalcalupi.loadbalancer.server.port=80"
      - "traefik.docker.network=proxy"

  db:
    image: mariadb:11
    container_name: calendario-cavalcalupi_db
    restart: unless-stopped
    environment:
      - MYSQL_ALLOW_EMPTY_PASSWORD=yes
      - MYSQL_DATABASE=calendario_cavalcalupi
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  worker:
    build: .
    container_name: calendario-cavalcalupi_worker
    restart: unless-stopped
    command: supervisord -c /etc/supervisor/worker.conf
    stop_grace_period: 70s
    volumes:
      - ./storage:/var/www/html/storage
      - ./.env:/var/www/html/.env:ro
      - ./docker/supervisor/worker.conf:/etc/supervisor/worker.conf:ro
    environment:
      - DB_HOST=db
      - DB_DATABASE=calendario_cavalcalupi
      - DB_USERNAME=calendario_cavalcalupi
      - DB_PASSWORD=
    networks:
      internal:
        ipv4_address: 172.24.0.11
    depends_on:
      db:
        condition: service_healthy

networks:
  internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.24.0.0/24
  proxy:
    external: true

volumes:
  db_data:
  build_assets:
